name: Build Custom Telegram

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Native Build Tools
        run: sudo apt-get update && sudo apt-get install -y yasm ninja-build cmake

      - name: Create dummy google-services.json
        run: |
          echo '{ "project_info": { "project_number": "123456789", "project_id": "dummy-project" }, "client": [ { "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef", "client_id": "android:com.drklo.telegram", "client_type": 1, "android_client_info": { "package_name": "org.telegram.messenger" } }, "api_key": [ { "current_key": "dummy-key" } ] } ], "configuration_version": "1" }' > TMessagesProj/google-services.json

      - name: Inject API ID and HASH
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -f "$FILE" ]; then
            sed -i "s/APP_ID = .*/APP_ID = $TG_API_ID;/g" $FILE
            sed -i "s/APP_HASH = .*/APP_HASH = \"$TG_API_HASH\";/g" $FILE
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (Standalone Debug)
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          bash ./gradlew assembleStandaloneDebug --no-daemon --stacktrace
