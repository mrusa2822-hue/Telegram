name: Build Custom Telegram

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Native Build Tools
        run: sudo apt-get update && sudo apt-get install -y yasm ninja-build cmake

      - name: Create dummy google-services.json
        run: |
          cat > TMessagesProj/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "client_id": "android:123456789abcdef"
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Inject API ID and HASH
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -f "$FILE" ]; then
            python3 - "$FILE" "$TG_API_ID" "$TG_API_HASH" <<'PY'
import re
import sys
from pathlib import Path

file_path = Path(sys.argv[1])
api_id = sys.argv[2]
api_hash = sys.argv[3]
text = file_path.read_text()

text = re.sub(
    r'(?m)^(\s*public static int APP_ID = ).*;(\s*)$',
    rf'\1{api_id};\2',
    text,
    count=1,
)
text = re.sub(
    r'(?m)^(\s*public static String APP_HASH = ).*;(\s*)$',
    rf'\1"{api_hash}";\2',
    text,
    count=1,
)

file_path.write_text(text)
PY
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (Debug)
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZdCustomGram-APK
          path: TMessagesProj/build/outputs/apk/*/debug/*.apk
